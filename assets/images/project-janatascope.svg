<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500" role="img" aria-label="Janatascope civic data analytics dashboard">
  <defs>
    <linearGradient id="ja-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2a2a2e"/>
      <stop offset="1" stop-color="#121214"/>
    </linearGradient>
    <linearGradient id="ja-gold" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#ffb75c"/>
      <stop offset="1" stop-color="#ffdb70"/>
    </linearGradient>
    <linearGradient id="ja-goldh" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffdb70"/>
      <stop offset="1" stop-color="#ffb75c"/>
    </linearGradient>
    <linearGradient id="ja-area" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffdb70" stop-opacity=".38"/>
      <stop offset="1" stop-color="#ffdb70" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="ja-glow" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#ffdb70" stop-opacity=".30"/>
      <stop offset="1" stop-color="#ffdb70" stop-opacity="0"/>
    </radialGradient>
    <pattern id="ja-grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0v40" fill="none" stroke="#ffffff" stroke-opacity=".05" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="800" height="500" fill="url(#ja-bg)"/>
  <rect width="800" height="500" fill="url(#ja-grid)"/>
  <circle cx="648" cy="150" r="230" fill="url(#ja-glow)"/>

  <!-- header -->
  <g>
    <circle cx="52" cy="52" r="17" fill="none" stroke="url(#ja-goldh)" stroke-width="3"/>
    <circle cx="52" cy="52" r="6" fill="#ffdb70"/>
    <path d="M64 64l14 14" stroke="url(#ja-goldh)" stroke-width="4" stroke-linecap="round"/>
    <text x="90" y="49" font-family="Poppins, Segoe UI, sans-serif" font-size="25" font-weight="600" fill="#fafafa">Janatascope</text>
    <text x="90" y="70" font-family="Poppins, Segoe UI, sans-serif" font-size="13" font-weight="300" fill="#d6d6d6" opacity=".8">Civic sentiment &amp; public data intelligence</text>
  </g>
  <rect x="640" y="36" width="126" height="32" rx="16" fill="#ffdb70" fill-opacity=".12" stroke="#ffdb70" stroke-opacity=".4"/>
  <circle cx="662" cy="52" r="4.5" fill="#7ddba0"/>
  <text x="675" y="57" font-family="Poppins, Segoe UI, sans-serif" font-size="12" font-weight="400" fill="#ffdb70">live feed</text>

  <!-- KPI cards -->
  <g font-family="Poppins, Segoe UI, sans-serif">
    <rect x="36" y="100" width="170" height="86" rx="14" fill="#1c1c1f" stroke="#3a3a3a"/>
    <text x="54" y="128" font-size="11" font-weight="300" fill="#a9a9a9">RECORDS PARSED</text>
    <text x="54" y="158" font-size="26" font-weight="600" fill="#ffdb70">1.2M</text>
    <text x="120" y="158" font-size="12" fill="#7ddba0">+18%</text>

    <rect x="220" y="100" width="170" height="86" rx="14" fill="#1c1c1f" stroke="#3a3a3a"/>
    <text x="238" y="128" font-size="11" font-weight="300" fill="#a9a9a9">DISTRICTS</text>
    <text x="238" y="158" font-size="26" font-weight="600" fill="#ffdb70">742</text>
    <text x="296" y="158" font-size="12" fill="#7ddba0">+31</text>

    <rect x="404" y="100" width="170" height="86" rx="14" fill="#1c1c1f" stroke="#3a3a3a"/>
    <text x="422" y="128" font-size="11" font-weight="300" fill="#a9a9a9">MODEL F1</text>
    <text x="422" y="158" font-size="26" font-weight="600" fill="#ffdb70">0.94</text>
    <text x="484" y="158" font-size="12" fill="#7ddba0">NLP</text>
  </g>

  <!-- trend chart panel -->
  <g>
    <rect x="36" y="204" width="538" height="256" rx="16" fill="#1c1c1f" stroke="#3a3a3a"/>
    <text x="56" y="234" font-family="Poppins, Segoe UI, sans-serif" font-size="14" font-weight="500" fill="#fafafa">Public sentiment trend</text>
    <g stroke="#ffffff" stroke-opacity=".07">
      <path d="M56 268h498M56 310h498M56 352h498M56 394h498"/>
    </g>
    <path d="M60 388 108 356 156 366 204 318 252 332 300 286 348 300 396 262 444 272 492 246 540 254 540 424 60 424Z" fill="url(#ja-area)"/>
    <path d="M60 388 108 356 156 366 204 318 252 332 300 286 348 300 396 262 444 272 492 246 540 254" fill="none" stroke="url(#ja-goldh)" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
    <g fill="#121214" stroke="#ffdb70" stroke-width="3">
      <circle cx="204" cy="318" r="5"/>
      <circle cx="396" cy="262" r="5"/>
      <circle cx="540" cy="254" r="5"/>
    </g>
    <g font-family="Poppins, Segoe UI, sans-serif" font-size="10" font-weight="300" fill="#8f8f8f">
      <text x="58" y="444">JAN</text>
      <text x="154" y="444">MAR</text>
      <text x="250" y="444">MAY</text>
      <text x="346" y="444">JUL</text>
      <text x="442" y="444">SEP</text>
      <text x="524" y="444">NOV</text>
    </g>
  </g>

  <!-- side panel: donut + bars -->
  <g>
    <rect x="592" y="100" width="172" height="180" rx="16" fill="#1c1c1f" stroke="#3a3a3a"/>
    <text x="610" y="128" font-family="Poppins, Segoe UI, sans-serif" font-size="12" font-weight="500" fill="#fafafa">Opinion split</text>
    <circle cx="678" cy="200" r="52" fill="none" stroke="#333336" stroke-width="16"/>
    <circle cx="678" cy="200" r="52" fill="none" stroke="url(#ja-gold)" stroke-width="16" stroke-linecap="round" stroke-dasharray="204 327" transform="rotate(-90 678 200)"/>
    <circle cx="678" cy="200" r="52" fill="none" stroke="#7ddba0" stroke-opacity=".75" stroke-width="16" stroke-linecap="round" stroke-dasharray="72 327" transform="rotate(135 678 200)"/>
    <text x="678" y="196" text-anchor="middle" font-family="Poppins, Segoe UI, sans-serif" font-size="20" font-weight="600" fill="#fafafa">62%</text>
    <text x="678" y="214" text-anchor="middle" font-family="Poppins, Segoe UI, sans-serif" font-size="10" font-weight="300" fill="#a9a9a9">positive</text>
  </g>

  <g>
    <rect x="592" y="296" width="172" height="164" rx="16" fill="#1c1c1f" stroke="#3a3a3a"/>
    <text x="610" y="322" font-family="Poppins, Segoe UI, sans-serif" font-size="12" font-weight="500" fill="#fafafa">Top regions</text>
    <g>
      <rect x="610" y="338" width="136" height="9" rx="4.5" fill="#333336"/>
      <rect x="610" y="338" width="122" height="9" rx="4.5" fill="url(#ja-goldh)"/>
      <rect x="610" y="366" width="136" height="9" rx="4.5" fill="#333336"/>
      <rect x="610" y="366" width="98" height="9" rx="4.5" fill="url(#ja-goldh)"/>
      <rect x="610" y="394" width="136" height="9" rx="4.5" fill="#333336"/>
      <rect x="610" y="394" width="74" height="9" rx="4.5" fill="url(#ja-goldh)"/>
      <rect x="610" y="422" width="136" height="9" rx="4.5" fill="#333336"/>
      <rect x="610" y="422" width="51" height="9" rx="4.5" fill="url(#ja-goldh)"/>
    </g>
  </g>
</svg>
